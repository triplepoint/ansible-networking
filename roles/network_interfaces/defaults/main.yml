---
# Network interface definitions, such that they'll appear
# in /etc/network/interfaces
network_interfaces_ifaces: []
  # - comment: "WAN"              # Comment block which will be inserted into the /etc/network/interfaces file
  #   interface: eth0             # The interface name
  #   ipv4:
  #     configuration: dhcp       # How the interface is configured - `manual`, `dhcp`, `static`, etc
                                  #
                                  # Additional allowed fields include `address`, `netmask`,
                                  #   `gateway`, `network`, `broadcast`, and `vlan_device`
  #   ipv6:
  #     configuration: dhcp
  # - comment: "LAN"              # As another example...
  #   interface: eth1
  #   ipv4:
  #     configuration: static
  #     address: "192.168.0.1"
  #     netmask: "255.255.255.0"
  #     network: "192.168.0.0"
  #     broadcast: "192.168.0.255"

# Count, in frames, for the size of the transmit queue lengths.  This value
# will be set on all interface defined in network_interfaces_ifaces.
# 1000 was the default value on a stock Ubuntu Xenial install.
network_interfaces_txqueue_length: 1000

# dhcpcd manages only the WAN interface.  It requests an IPv4 lease, an IPv6
# address, and (when assignments are given) an IPv6 delegated prefix.
network_interfaces_dhcpcd_wan_interface: "eth0"

# Interfaces that each get a /64 carved out of the delegated prefix.  sla_id
# picks which /64 (0 is the first), so keep it stable for each interface or its
# prefix will change.  The delegated prefix must be big enough for every sla_id:
# a /64 only covers sla_id 0, a /60 covers 0-15.
network_interfaces_dhcpcd_ia_pd_assignments: []
  # - interface: eth1
  #   sla_id: 0
  # - interface: eth1.2
  #   sla_id: 1

# Prefix length to ask the ISP to delegate, e.g. 60.  Empty means take whatever
# the ISP gives by default (often only a /64).
network_interfaces_dhcpcd_ia_pd_prefix_length: ""
