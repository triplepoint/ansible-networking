---
- name: Ensure dnsmasq is installed
  ansible.builtin.package:
    name: dnsmasq
    state: present

- name: Ensure dnsmasq config file is installed
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    validate: /usr/sbin/dnsmasq -C %s --test
    mode: "0644"
  notify: Restart dnsmasq

- name: Ensure systemd-resolved isn't set up to listen on port 53
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: "DNSStubListener="
    line: "DNSStubListener=no"
  notify: Restart resolved

# Earlier versions of this role ordered dnsmasq before systemd-resolved, first
# with a line added to the packaged unit file (which landed in [Install], where
# systemd ignored it) and then with a drop-in.  The ordering isn't needed, since
# DNSStubListener=no above already keeps resolved off port 53, and it's harmful:
# resolved is ordered before network.target and dnsmasq after it, so the drop-in
# created an ordering cycle that delayed resolved at boot.  Without resolved,
# /run/systemd/resolve/stub-resolv.conf (the target of /etc/resolv.conf) didn't
# exist yet, and dhcpcd.service failed to start.  Remove both leftovers.
- name: Ensure the old Before= line is gone from the packaged dnsmasq unit
  ansible.builtin.lineinfile:
    path: /usr/lib/systemd/system/dnsmasq.service
    regexp: "^Before=systemd-resolved.service$"
    state: absent
  notify:
    - Reload systemd

- name: Ensure the dnsmasq-before-resolved drop-in is gone
  ansible.builtin.file:
    path: /etc/systemd/system/dnsmasq.service.d/10-before-resolved.conf
    state: absent
  notify:
    - Reload systemd

- name: Ensure Dnsmasq changes take effect before we go on
  ansible.builtin.meta: flush_handlers
