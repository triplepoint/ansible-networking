---
# Handlers run in the order they are defined here, so reload systemd first:
# the restarts below must see any changed unit files.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    state: restarted

- name: Restart resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
